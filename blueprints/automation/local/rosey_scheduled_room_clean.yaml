blueprint:
  name: Rosey Scheduled Room Clean
  description: >
    Runs the Narwal vacuum/mop through a specific ordered set of rooms on a
    recurring schedule, with every cleaning option (mode, suction, water,
    mop strength, passes, route) customizable independently per room in
    the run. Rooms are cleaned strictly in the order given (Room 1 first,
    then Room 2, ...), waiting for each room to finish before starting the
    next. Unused room slots are left at "(Skip this slot)".

    Create one automation per desired run (e.g. "Rosey - Weekday Morning",
    "Rosey - Weekend Deep Clean") to support multiple runs per day or
    different room sets on different days.
  domain: automation
  input:
    vacuum_entity:
      name: Vacuum
      description: The Narwal vacuum entity to control.
      selector:
        entity:
          domain: vacuum
          integration: narwal
    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      input:
        run_time:
          name: Time
          default: "09:00:00"
          selector:
            time: {}
        run_days:
          name: Days
          description: Days of the week this run should fire.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              mode: list
              options:
                - { label: Monday, value: mon }
                - { label: Tuesday, value: tue }
                - { label: Wednesday, value: wed }
                - { label: Thursday, value: thu }
                - { label: Friday, value: fri }
                - { label: Saturday, value: sat }
                - { label: Sunday, value: sun }
    room_1:
      name: Room 1
      icon: mdi:numeric-1-circle-outline
      collapsed: false
      input:
        room_1_room:
          name: Room
          description: Which room to clean in this step. Leave as "(Skip this slot)" if this run has fewer than 12 rooms.
          default: "0"
          selector:
            select:
              mode: dropdown
              options:
                - { label: "(Skip this slot)", value: "0" }
                - { label: "Kitchen", value: "1" }
                - { label: "Master Bedroom", value: "2" }
                - { label: "Jason Office", value: "3" }
                - { label: "Master Bathroom", value: "4" }
                - { label: "Corridor 2", value: "5" }
                - { label: "Mudroom", value: "6" }
                - { label: "Guest Bathroom", value: "7" }
                - { label: "Guest Bedroom", value: "8" }
                - { label: "Alexia Closet", value: "9" }
                - { label: "Corridor", value: "10" }
                - { label: "Jason Closet", value: "11" }
                - { label: "Master WC", value: "12" }
                - { label: "Sitting Room", value: "13" }
                - { label: "Living Room", value: "14" }
        room_1_mode:
          name: Clean mode
          default: vacuum_and_mop
          selector:
            select:
              options:
                - { label: "Vacuum only", value: vacuum }
                - { label: "Mop only", value: mop }
                - { label: "Vacuum then mop", value: vacuum_then_mop }
                - { label: "Vacuum and mop together", value: vacuum_and_mop }
        room_1_suction:
          name: Suction
          default: standard
          selector:
            select:
              options:
                - { label: "AI (adaptive)", value: ai }
                - { label: "Quiet", value: quiet }
                - { label: "Standard", value: standard }
                - { label: "Strong", value: strong }
                - { label: "Super Powerful", value: super_powerful }
                - { label: "Ultra Powerful", value: ultra_powerful }
        room_1_water:
          name: Water level
          default: normal
          selector:
            select:
              options:
                - { label: "Dry", value: dry }
                - { label: "Normal", value: normal }
                - { label: "Wet", value: wet }
        room_1_mop_strength:
          name: Mop scrub strength
          default: normal
          selector:
            select:
              options:
                - { label: "Normal", value: normal }
                - { label: "High", value: high }
        room_1_passes:
          name: Passes
          default: 1
          selector:
            number: { min: 1, max: 3, step: 1, mode: box }
        room_1_route:
          name: Route
          default: standard
          selector:
            select:
              options:
                - { label: "Standard", value: standard }
                - { label: "Meticulous", value: meticulous }
    room_2:
