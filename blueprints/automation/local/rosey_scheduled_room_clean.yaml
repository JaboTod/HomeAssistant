      for_each: "{{ steps }}"
      sequence:
        - action: narwal.clean_rooms
          target:
            entity_id: !input vacuum_entity
          data:
            rooms: ["{{ repeat.item.room | int }}"]
            mode: "{{ repeat.item.mode }}"
            suction: "{{ repeat.item.suction }}"
            water: "{{ repeat.item.water }}"
            mop_strength: "{{ repeat.item.mop_strength }}"
            passes: "{{ repeat.item.passes | int }}"
            route: "{{ repeat.item.route }}"
          note: Sends this room's own settings as a single-room clean command.
        - wait_for_trigger:
            - trigger: state
              entity_id: !input vacuum_entity
              attribute: task_status
              from: cleaning
          timeout: "02:00:00"
          continue_on_timeout: true
          note: Wait for Rosey to leave "cleaning" (finished, docked, or errored) before sending the next room, so rooms run strictly in order and commands never collide.
        - delay:
            seconds: 10
    note: Runs each populated room slot in order, one at a time.
